<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1030"/>
      <stop offset="60%" stop-color="#131a3a"/>
      <stop offset="100%" stop-color="#0a1440"/>
    </linearGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c6fb0"/>
      <stop offset="45%" stop-color="#1a4f8f"/>
      <stop offset="100%" stop-color="#0c2a5c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f2050"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="60" r="1.6" opacity="0.9"/>
    <circle cx="140" cy="110" r="1.1" opacity="0.6"/>
    <circle cx="230" cy="50" r="1.3" opacity="0.8"/>
    <circle cx="320" cy="90" r="1" opacity="0.5"/>
    <circle cx="470" cy="55" r="1.4" opacity="0.9"/>
    <circle cx="560" cy="95" r="1" opacity="0.6"/>
    <circle cx="650" cy="45" r="1.5" opacity="0.85"/>
    <circle cx="720" cy="100" r="1.1" opacity="0.6"/>
    <circle cx="90" cy="180" r="1" opacity="0.5"/>
    <circle cx="400" cy="35" r="1.2" opacity="0.7"/>
    <circle cx="740" cy="160" r="1.3" opacity="0.7"/>
    <circle cx="30" cy="130" r="1.1" opacity="0.6"/>
  </g>

  <!-- Earth limb -->
  <circle cx="400" cy="760" r="420" fill="url(#earth)"/>
  <circle cx="400" cy="760" r="420" fill="none" stroke="#5ec2ff" stroke-width="3" opacity="0.55"/>

  <!-- ISS, centered slightly above the horizon -->
  <g transform="translate(400,215)">

    <!-- main truss -->
    <rect x="-230" y="-6" width="460" height="12" rx="6" fill="#d7dee8"/>
    <g stroke="#aab4c4" stroke-width="2">
      <line x1="-210" y1="-6" x2="-210" y2="6"/>
      <line x1="-170" y1="-6" x2="-170" y2="6"/>
      <line x1="-130" y1="-6" x2="-130" y2="6"/>
      <line x1="130" y1="-6" x2="130" y2="6"/>
      <line x1="170" y1="-6" x2="170" y2="6"/>
      <line x1="210" y1="-6" x2="210" y2="6"/>
    </g>

    <!-- left solar array (two wings) -->
    <g>
      <rect x="-350" y="-58" width="110" height="46" fill="url(#panel)" stroke="#6ea8ff" stroke-width="1.5"/>
      <rect x="-350" y="12" width="110" height="46" fill="url(#panel)" stroke="#6ea8ff" stroke-width="1.5"/>
      <g stroke="#6ea8ff" stroke-width="1" opacity="0.8">
        <line x1="-328" y1="-58" x2="-328" y2="-12"/>
        <line x1="-306" y1="-58" x2="-306" y2="-12"/>
        <line x1="-284" y1="-58" x2="-284" y2="-12"/>
        <line x1="-262" y1="-58" x2="-262" y2="-12"/>
        <line x1="-328" y1="12" x2="-328" y2="58"/>
        <line x1="-306" y1="12" x2="-306" y2="58"/>
        <line x1="-284" y1="12" x2="-284" y2="58"/>
        <line x1="-262" y1="12" x2="-262" y2="58"/>
      </g>
      <line x1="-240" y1="0" x2="-230" y2="0" stroke="#d7dee8" stroke-width="4"/>
    </g>

    <!-- right solar array (two wings) -->
    <g>
      <rect x="240" y="-58" width="110" height="46" fill="url(#panel)" stroke="#6ea8ff" stroke-width="1.5"/>
      <rect x="240" y="12" width="110" height="46" fill="url(#panel)" stroke="#6ea8ff" stroke-width="1.5"/>
      <g stroke="#6ea8ff" stroke-width="1" opacity="0.8">
        <line x1="262" y1="-58" x2="262" y2="-12"/>
        <line x1="284" y1="-58" x2="284" y2="-12"/>
        <line x1="306" y1="-58" x2="306" y2="-12"/>
        <line x1="328" y1="-58" x2="328" y2="-12"/>
        <line x1="262" y1="12" x2="262" y2="58"/>
        <line x1="284" y1="12" x2="284" y2="58"/>
        <line x1="306" y1="12" x2="306" y2="58"/>
        <line x1="328" y1="12" x2="328" y2="58"/>
      </g>
      <line x1="230" y1="0" x2="240" y2="0" stroke="#d7dee8" stroke-width="4"/>
    </g>

    <!-- module cluster (Unity/Destiny/Zvezda, simplified) -->
    <g>
      <rect x="-95" y="-22" width="190" height="30" rx="14" fill="#e7ecf3"/>
      <rect x="-40" y="-46" width="34" height="94" rx="14" fill="#cfd8e6"/>
      <rect x="-118" y="-13" width="26" height="12" rx="5" fill="#b9c4d6"/>
      <rect x="92" y="-13" width="26" height="12" rx="5" fill="#b9c4d6"/>
      <circle cx="-95" cy="-7" r="3.5" fill="#9fb0c9"/>
      <circle cx="95" cy="-7" r="3.5" fill="#9fb0c9"/>
    </g>

    <!-- radiator panels -->
    <g fill="#f4f7fb" opacity="0.95">
      <rect x="-58" y="-88" width="46" height="14" rx="2"/>
      <rect x="12" y="-88" width="46" height="14" rx="2"/>
    </g>
  </g>
</svg>
